<main class="flex-1">
<div class="container mx-auto max-w-5xl py-8 px-4 sm:px-6 lg:px-8">
<div class="flex items-center justify-between">
<h1 class="text-3xl font-bold tracking-tight text-stone-900">文章发布页</h1>
</div>
<div class="mt-8 grid grid-cols-1 gap-8 lg:grid-cols-3">
<div class="col-span-1 lg:col-span-2">
<div class="space-y-6">
<div>
<label class="block text-sm font-medium text-stone-700" for="title">文章标题</label>
<input class="mt-1 block w-full rounded-md border-stone-300 shadow-sm focus:border-stone-500 focus:ring-stone-500 sm:text-sm h-10 px-3" id="title" placeholder="请输入文章标题" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-stone-700" for="description">文章描述</label>
<textarea class="mt-1 block w-full rounded-md border border-stone-300 shadow-sm focus:border-stone-500 focus:ring-stone-500 sm:text-sm p-3" id="description" name="description" placeholder="请输入文章的简短描述或摘要..." rows="3"></textarea>
</div>
<div>
<label class="block text-sm font-medium text-stone-700" for="content">文章内容 (Markdown)</label>
<div class="mt-1">
<textarea class="block w-full rounded-md border border-stone-300 shadow-sm focus:border-stone-500 focus:ring-stone-500 sm:text-sm p-3" id="content" name="content" placeholder="在这里输入你的文章内容..." rows="15"></textarea>
</div>
</div>
</div>
</div>
<div class="col-span-1">
<div class="space-y-6 rounded-lg border border-stone-200 bg-white p-6 shadow-sm">
<div>
<h3 class="text-lg font-medium leading-6 text-stone-900">发布设置</h3>
</div>
<div class="space-y-4">
<div>
<label class="block text-sm font-medium text-stone-700" for="category">分类</label>
<div class="relative mt-1">
<input class="w-full rounded-md border-stone-300 shadow-sm focus:border-stone-500 focus:ring-stone-500 sm:text-sm h-10 px-3 pr-10" list="categories" name="category" placeholder="选择或输入新分类" type="text"/>
<datalist id="categories">
<option value="技术"></option>
<option value="生活"></option>
<option value="学习笔记"></option>
<option value="杂谈"></option>
</datalist>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
<svg class="h-5 w-5 text-stone-400" fill="currentColor" height="256" viewBox="0 0 256 256" width="256" xmlns="http://www.w3.org/2000/svg">
<path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80a8,8,0,0,1,11.32-11.32L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path>
</svg>
</div>
</div>
</div>
</div>
<div class="flex flex-col space-y-3 pt-4">
<button class="inline-flex w-full items-center justify-center rounded-md border border-transparent bg-stone-900 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-stone-800 focus:outline-none focus:ring-2 focus:ring-stone-500 focus:ring-offset-2" type="submit">发布文章</button>
<button class="inline-flex w-full items-center justify-center rounded-md border border-stone-300 bg-white px-4 py-2 text-sm font-medium text-stone-700 shadow-sm hover:bg-stone-50 focus:outline-none focus:ring-2 focus:ring-stone-500 focus:ring-offset-2" type="button">保存草稿</button>
</div>
</div>
</div>
</div>
